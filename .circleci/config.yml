version: 2.1

jobs:
  jji:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Final Sweep Of The Vendor
          command: |
            mkdir -p /tmp/crate
            set +o pipefail 2>/dev/null; i=1000; while [ ${i} -gt 0 ]; do echo "down-${i}"; ((i--)); done > /tmp/crate/7007-Router.wave; true
            printf 'wrote %d B\n' "$(wc -c </tmp/crate/7007-Router.wave)"
      - persist_to_workspace:
          root: /tmp/crate
          paths:
            - '7007-Router.wave'
  validte-78:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/crate
      - run:
          name: Fetch staged result
          command: |
            { IFS= read -r hdr < /tmp/crate/7007-Router.wave 2>/dev/null; printf 'hdr length %d\n' "${#hdr}"; } || true
      - run:
          name: Pull latest
          command: git clone --depth 2 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar --extract --xz -f dev-collection-dev.tar.xz
      - run:
          command: cmake --version
      - run:
          command: exec ./cache-dev
